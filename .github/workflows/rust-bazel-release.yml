name: Rust Bazel release

# Reusable workflow: build a Bazel rust_binary on native runners, attach archives to a GitHub Release
# with a git-cliff changelog, and publish a Homebrew formula. Call it from a tag-triggered workflow
# (see docs/rust-bazel-publish.md). Run directly with workflow_dispatch it is a dry run.

on:
  workflow_call:
    inputs:
      package-name:
        description: Formula and archive name, lowercase (dunnage).
        type: string
        required: true
      binary-name:
        description: Executable name inside the archive. Defaults to package-name.
        type: string
        default: ''
      bazel-target:
        description: Bazel label of the rust_binary (//crates/cli:dunnage).
        type: string
        required: true
      targets:
        description: >
          JSON array of {"triple", "runner"} objects; each builds natively on its runner.
        type: string
        default: >-
          [{"triple":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},
          {"triple":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm"},
          {"triple":"aarch64-apple-darwin","runner":"macos-15"}]
      working-directory:
        description: Bazel workspace root (where MODULE.bazel and .bazelversion are), relative to the repository root.
        type: string
        default: '.'
      bazel-configs:
        description: Whitespace-separated Bazel configs (each becomes --config=NAME), for example `release`.
        type: string
        default: ''
      bazel-args:
        description: Newline-separated extra `bazel build` arguments.
        type: string
        default: ''
      remote-cache:
        description: Remote cache endpoint for Bazel (for example one started by the caller); empty for none.
        type: string
        default: ''
      description:
        description: One-line formula description.
        type: string
        required: true
      homepage:
        description: Formula homepage. Defaults to the repository URL.
        type: string
        default: ''
      license:
        description: SPDX license expression for the formula (MIT OR Apache-2.0).
        type: string
        required: true
      tap-repository:
        description: Homebrew tap as owner/name.
        type: string
        default: tstapler/homebrew-tap
      formula-path:
        description: Path of the formula inside the tap.
        type: string
        default: ''
      homebrew-app-client-id:
        description: Client ID of the GitHub App installed on the tap (a repo variable; not secret).
        type: string
        default: ''
      publish-homebrew:
        description: Publish the formula to the tap after the release.
        type: boolean
        default: true
      cliff-config:
        description: git-cliff config path in the repository.
        type: string
        default: cliff.toml
      version:
        description: Version to release when not running on a tag (dry run). On a tag it is taken from the tag.
        type: string
        default: ''
      dry-run:
        description: Build, package and render the release assets, but create no release and push nothing.
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY:
        description: Private key of the GitHub App installed on the tap.
        required: false
  workflow_dispatch:
    inputs:
      package-name:
        description: Formula and archive name, lowercase.
        type: string
        required: true
      binary-name:
        description: Executable name inside the archive. Defaults to package-name.
        type: string
        default: ''
      bazel-target:
        description: Bazel label of the rust_binary.
        type: string
        required: true
      targets:
        description: JSON array of {"triple", "runner"} objects.
        type: string
        default: >-
          [{"triple":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},
          {"triple":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm"},
          {"triple":"aarch64-apple-darwin","runner":"macos-15"}]
      bazel-configs:
        description: Whitespace-separated Bazel configs.
        type: string
        default: ''
      description:
        description: One-line formula description.
        type: string
        required: true
      license:
        description: SPDX license expression.
        type: string
        required: true
      version:
        description: Version to package (a dispatch has no tag).
        type: string
        required: true
      dry-run:
        description: Always true for a dispatch; nothing is published.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: rust-bazel-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      binary: ${{ steps.resolve.outputs.binary }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry-run }}
          IN_PACKAGE: ${{ inputs.package-name }}
          IN_BINARY: ${{ inputs.binary-name }}
          IN_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ $IN_PACKAGE =~ ^[a-z0-9][a-z0-9._+-]*$ ]] || { echo "::error::package-name '$IN_PACKAGE' must be lowercase letters, digits and . _ + -"; exit 1; }
          binary=${IN_BINARY:-$IN_PACKAGE}
          [[ $binary =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::binary-name '$binary' has unsupported characters"; exit 1; }
          tag=""
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; version=${REF_NAME#v}; else version=${IN_VERSION#v}; fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || { echo "::error::version '$version' is not semver; push a tag like v1.2.3, or pass version for a dry run"; exit 1; }
          if [ -n "$IN_VERSION" ] && [ -n "$tag" ] && [ "${IN_VERSION#v}" != "$version" ]; then
            echo "::error::version input '$IN_VERSION' disagrees with tag '$tag'"; exit 1
          fi
          publish=false
          if [ "$IN_DRY_RUN" != true ] && [ "$EVENT" != workflow_dispatch ] && [ -n "$tag" ]; then publish=true; fi
          matrix=$(printf '%s' "$IN_TARGETS" | jq -c 'if (type == "array" and length > 0 and all(.[]; (.triple // "" | test("^[a-z0-9_]+(-[a-z0-9_]+)+$")) and (.runner // "" | test("^[A-Za-z0-9._-]+$")))) then . else error("targets must be a non-empty array of {triple, runner}") end')
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "binary=$binary"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tag '${tag:-none}', publish $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.triple }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tstapler/gha-actions/setup-bazel@cf2839eb37c521e01e0f9b82925a89ed525c0fc3 # feat/rust-bazel-publish
        with:
          disk-cache: 'true'
          working-directory: ${{ inputs.working-directory || '.' }}
          cache-key: release-${{ matrix.triple }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          remote-cache: ${{ inputs.remote-cache }}

      - uses: tstapler/gha-actions/bazel-rust-package@cf2839eb37c521e01e0f9b82925a89ed525c0fc3 # feat/rust-bazel-publish
        with:
          working-directory: ${{ inputs.working-directory || '.' }}
          target: ${{ inputs.bazel-target }}
          binary-name: ${{ needs.prepare.outputs.binary }}
          target-triple: ${{ matrix.triple }}
          version: ${{ needs.prepare.outputs.version }}
          configs: ${{ inputs.bazel-configs }}
          bazel-args: ${{ inputs.bazel-args }}

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history between tags
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: tstapler/gha-actions/setup-git-cliff@cf2839eb37c521e01e0f9b82925a89ed525c0fc3 # feat/rust-bazel-publish

      - name: SHA256SUMS and changelog
        shell: bash
        env:
          CLIFF_CONFIG: ${{ inputs.cliff-config }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && cat -- *.tar.gz.sha256 | LC_ALL=C sort -k2 > SHA256SUMS && rm -- *.tar.gz.sha256)
          (cd dist && sha256sum --check --strict SHA256SUMS)
          if [ -f "$CLIFF_CONFIG" ] && [ -n "$TAG" ]; then
            git-cliff --config "$CLIFF_CONFIG" --latest --strip header > CHANGELOG_BODY.md
          elif [ -f "$CLIFF_CONFIG" ]; then
            git-cliff --config "$CLIFF_CONFIG" --unreleased --strip header > CHANGELOG_BODY.md || true
          fi
          [ -s CHANGELOG_BODY.md ] || echo "No changelog entries." > CHANGELOG_BODY.md
          {
            echo '### Release assets'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo '### Changelog'
            cat CHANGELOG_BODY.md
          } >> "$GITHUB_STEP_SUMMARY"

      - id: formula
        uses: tstapler/gha-actions/generate-homebrew-formula@cf2839eb37c521e01e0f9b82925a89ed525c0fc3 # feat/rust-bazel-publish
        with:
          name: ${{ inputs.package-name }}
          binary-name: ${{ needs.prepare.outputs.binary }}
          version: ${{ needs.prepare.outputs.version }}
          desc: ${{ inputs.description }}
          homepage: ${{ inputs.homepage || format('{0}/{1}', github.server_url, github.repository) }}
          license: ${{ inputs.license }}
          sums-file: dist/SHA256SUMS
          url-base: ${{ format('{0}/{1}/releases/download/v{2}', github.server_url, github.repository, needs.prepare.outputs.version) }}
          output: formula/${{ inputs.package-name }}.rb

      - name: Show the formula
        shell: bash
        env:
          FORMULA: ${{ steps.formula.outputs.formula-path }}
        run: |
          { echo '### Formula'; echo '```ruby'; cat "$FORMULA"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            CHANGELOG_BODY.md
            formula/
          retention-days: 7
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets, nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Create the release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          case $TAG in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading assets over it"
            gh release upload "$TAG" --clobber assets/dist/*
            gh release edit "$TAG" --notes-file assets/CHANGELOG_BODY.md
          else
            gh release create "$TAG" assets/dist/* --verify-tag --title "$TAG" --notes-file assets/CHANGELOG_BODY.md ${prerelease[@]+"${prerelease[@]}"}
          fi

  homebrew:
    if: needs.prepare.outputs.publish == 'true' && inputs.publish-homebrew
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the tap token comes from the GitHub App, not GITHUB_TOKEN
    concurrency:
      group: homebrew-tap-${{ inputs.tap-repository }}
      cancel-in-progress: false
    steps:
      - name: Require the App credentials
        shell: bash
        env:
          CLIENT_ID: ${{ inputs.homebrew-app-client-id }}
          PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::set the homebrew-app-client-id input and the HOMEBREW_TAP_APP_PRIVATE_KEY secret, or pass publish-homebrew: false"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - uses: tstapler/gha-actions/publish-homebrew-formula@cf2839eb37c521e01e0f9b82925a89ed525c0fc3 # feat/rust-bazel-publish
        with:
          client-id: ${{ inputs.homebrew-app-client-id }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          files: assets/formula/${{ inputs.package-name }}.rb:${{ inputs.formula-path || format('Formula/{0}.rb', inputs.package-name) }}
          repositories: ${{ inputs.tap-repository }}
          commit-message: ${{ inputs.package-name }} ${{ needs.prepare.outputs.version }}
